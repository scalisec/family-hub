<style>
/* ---------- Themes: only these variables change between themes ---------- */
body[data-theme="Rink"]      { --bg:#EEF3F9; --card:#FFFFFF; --ink:#0F172A; --muted:#475569; --line:#D9E2EE; --chip:#EEF3F9; --accent:#1D4ED8; --accent-ink:#FFFFFF; --warn-bg:#FFF7ED; --warn:#9A3412; }
body[data-theme="Home"]      { --bg:#F6F0E8; --card:#FFFDFA; --ink:#2A211B; --muted:#62544A; --line:#E6DACB; --chip:#F6F0E8; --accent:#A8480F; --accent-ink:#FFFFFF; --warn-bg:#FFF7ED; --warn:#9A3412; }
body[data-theme="Night"]     { --bg:#0B1220; --card:#131C2E; --ink:#E5E9F0; --muted:#A3AEC2; --line:#24314A; --chip:#1C2840; --accent:#7FB4FF; --accent-ink:#0B1220; --warn-bg:#3A2410; --warn:#FDBA74; }
body[data-theme="Christmas"] { --bg:#EFE7DA; --card:#FFFCF6; --ink:#1F2A1E; --muted:#4B5A48; --line:#DED2BE; --chip:#F3ECE0; --accent:#B91C1C; --accent-ink:#FFFFFF; --warn-bg:#FFF7ED; --warn:#9A3412; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
h1, h2, .display { font-family: 'Space Grotesk', Inter, sans-serif; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.loading { padding: 32px; color: var(--muted); }
.muted { color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 1.25em; padding: 1.2em 1.4em; }
.dot { display: inline-block; width: .6em; height: .6em; border-radius: 50%; flex-shrink: 0; }
.chip { display: inline-flex; align-items: center; gap: .45em; background: var(--chip); border-radius: .6em; padding: .3em .6em; }
.eyebrow { font-size: .75em; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.error { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-weight: 600; }
#dim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 2s; }
body.dimmed #dim { opacity: .65; }

/* ---------- Wall (landscape, scales with screen width) ---------- */
body[data-view="wall"] { font-size: 1.25vw; overflow: hidden; cursor: none; }
.wall { height: 100vh; padding: 2.5vw; display: flex; flex-direction: column; gap: 1.6vw; }
.w-head { display: flex; justify-content: space-between; align-items: center; gap: 1.6vw; }
.w-date { font-size: 2.5em; font-weight: 700; line-height: 1; }
.w-sub { font-size: 1.1em; color: var(--muted); margin-top: .2em; }
.wx { display: flex; align-items: center; gap: 1.2em; }
.wx-temp { font-size: 1.9em; font-weight: 700; line-height: 1; }
.wx-sep { width: 1px; align-self: stretch; background: var(--line); }
.wx-wear { max-width: 18em; font-weight: 600; }
.w-cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 29fr 37fr 26fr; gap: 1.6vw; }
.col { display: flex; flex-direction: column; gap: 1.6vw; min-height: 0; }
.col > .card { overflow: hidden; }
.grow { flex: 1; min-height: 0; }
.card h2 { font-size: 1.35em; margin-bottom: .5em; }
.nu { display: flex; gap: .8em; padding: .7em 0; border-top: 1px solid var(--line); }
.nu-bar { width: .4em; border-radius: .2em; flex-shrink: 0; }
.nu-title { font-size: 1.2em; font-weight: 700; }
.nu-leave { font-size: 1.1em; font-weight: 700; color: var(--accent); }
.day { display: flex; gap: .9em; padding: .5em 0; border-top: 1px solid var(--line); align-items: flex-start; }
.day-label { width: 3.6em; flex-shrink: 0; }
.day-num { font-size: 1.45em; font-weight: 700; line-height: 1.1; }
.day-events { display: flex; flex-wrap: wrap; gap: .45em; }
.day.today .day-num { color: var(--accent); }
.legend { display: flex; gap: .8em; font-size: .8em; font-weight: 600; }
.legend span { display: inline-flex; align-items: center; gap: .35em; }
.row-line { display: flex; align-items: flex-start; gap: .6em; padding: .25em 0; }
.box { width: 1em; height: 1em; border-radius: .3em; border: .15em solid; flex-shrink: 0; margin-top: .15em; }
.empty { color: var(--muted); font-style: italic; }
.card.compact { padding: .9em 1.2em; }
.daily-text { font-size: 1.05em; font-weight: 600; margin-top: .3em; line-height: 1.35; }
.credit { font-size: .7em; color: var(--muted); margin-top: .4em; }
.mic { display: inline-flex; align-items: center; gap: 6px; }
.ptag { display: inline-flex; align-items: center; justify-content: center; min-width: 1.5em; height: 1.35em; padding: 0 .3em; border: .12em solid; border-radius: .7em; font-size: .72em; font-weight: 700; color: var(--ink); background: var(--card); }

/* ---------- Remote (phone + tablet) ---------- */
body[data-view="remote"] { font-size: 16px; }
.remote { max-width: 1100px; margin: 0 auto; padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
.r-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.r-top h1 { font-size: 24px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.tab { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--line); background: var(--card); font-weight: 600; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn { min-height: 44px; padding: 0 16px; border-radius: 12px; border: none; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); flex: 1 1 160px; }
.form input, .form select, .form textarea { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--card); color: var(--ink); font-size: 16px; }
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: 1px solid var(--line); }
.item input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--accent); }
.item.done span.t { text-decoration: line-through; color: var(--muted); }
.planner { overflow-x: auto; }
.grid { display: grid; grid-template-columns: 110px repeat(7, minmax(92px, 1fr)); gap: 6px; min-width: 780px; }
.slot { min-height: 60px; border-radius: 10px; border: 1px solid var(--line); background: var(--chip); padding: 6px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; }
.slot.need { border: 2px dashed var(--warn); background: var(--warn-bg); color: var(--warn); }
.slot.sel { border: 2px solid var(--accent); }
.slot[disabled] { border-style: dashed; background: transparent; color: var(--muted); cursor: default; }
.recipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.recipe { text-align: left; border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 10px 12px; cursor: pointer; min-height: 56px; }
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.theme { text-align: left; border-radius: 14px; background: var(--card); padding: 10px; cursor: pointer; border: 1px solid var(--line); }
.theme[aria-pressed="true"] { border: 3px solid var(--accent); }
.swatch { height: 90px; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.toast { background: #E7F6EF; color: #065F46; border-radius: 10px; padding: 10px 14px; font-weight: 600; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.pill[aria-pressed="true"] { border: 2px solid var(--accent); }
</style>
