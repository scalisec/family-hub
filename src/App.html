<script>
(function () {
  'use strict';
  var VIEW = window.FH_VIEW === 'wall' ? 'wall' : 'remote';
  var D = null;              // dashboard data from the server
  var tab = 'today';
  var weekOffset = 0;
  var sel = null;            // selected meal slot {date, slot}
  var todoFilter = 'All';
  var toast = '';
  var errorMsg = '';

  /* ---------- helpers ---------- */
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v;
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else el.setAttribute(k, v === true ? '' : String(v));
    });
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
    el.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  }
  function color(c) { return /^#[0-9a-f]{3,8}$/i.test(String(c)) ? c : '#64748B'; }
  function dot(c) { var s = h('span', { class: 'dot', 'aria-hidden': 'true' }); s.style.background = color(c); return s; }
  function colorOf(name) {
    var p = (D.people || []).find(function (x) { return x.name === name; });
    return p ? p.color : '#64748B';
  }
  // Short tag per person: first letter, or first two when names share a letter (e.g. Chris = Ch, Carla = Ca).
  function initials(name) {
    if (!name || name === 'Family') return '';
    var first = name.charAt(0).toUpperCase();
    var clash = (D.people || []).some(function (p) { return p.name !== name && p.name !== 'Family' && p.name.charAt(0).toUpperCase() === first; });
    return clash ? name.slice(0, 2) : first;
  }
  function tag(name, c) {
    var t = initials(name);
    if (!t) return null;
    var el = h('span', { class: 'ptag', title: name, 'aria-label': name }, t);
    el.style.borderColor = color(c || colorOf(name));
    return el;
  }
  function fmt(ms, opts) { return new Intl.DateTimeFormat('en-CA', Object.assign({ timeZone: D ? D.tz : 'America/Toronto' }, opts)).format(ms); }
  function time(ms) { return fmt(ms, { hour: 'numeric', minute: '2-digit' }).replace(/\./g, '').toUpperCase(); }
  function dayKey(ms) { return fmt(ms, { year: 'numeric', month: '2-digit', day: '2-digit' }); }
  function keyToDate(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12); }
  function kids() { return (D.people || []).filter(function (p) { return p.role === 'kid'; }); }
  function members() { return (D.people || []).filter(function (p) { return p.role !== 'group'; }); }

  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      r[fn].apply(r, args);
    });
  }
  function refresh() {
    return call('getDashboard', weekOffset).then(function (d) {
      D = d; errorMsg = '';
      document.body.setAttribute('data-theme', d.theme);
      render();
    }).catch(function (e) { errorMsg = (e && e.message) || 'Could not load.'; render(); });
  }
  function act(fn) {
    var args = Array.prototype.slice.call(arguments);
    return call.apply(null, args).then(function (res) { return refresh().then(function () { return res; }); })
      .catch(function (e) { errorMsg = (e && e.message) || 'Something went wrong.'; render(); });
  }

  /* ---------- shared widgets ---------- */
  function weatherBlock() {
    var w = D.weather;
    if (!w) return h('div', { class: 'card wx' }, h('span', { class: 'muted' }, 'Weather appears once a home address is saved in Setup'));
    var today = w.days[0];
    return h('div', { class: 'card wx' },
      h('div', null,
        h('div', { class: 'wx-temp display' }, w.temp + '°C'),
        h('div', { class: 'muted' }, w.label + ' · H ' + today.hi + '° · L ' + today.lo + '°' + (today.rain >= 30 ? ' · ' + today.rain + '% rain' : ''))),
      h('div', { class: 'wx-sep', 'aria-hidden': 'true' }),
      h('div', null, h('div', { class: 'eyebrow' }, 'What to wear'), h('div', { class: 'wx-wear' }, w.wear)),
      h('div', { class: 'wx-sep', 'aria-hidden': 'true' }),
      h('div', { class: 'muted' }, w.days.slice(1, 4).map(function (d) {
        return h('div', null, fmt(keyToDate(d.date), { weekday: 'short' }) + ' ' + d.hi + '° ' + d.label);
      })));
  }

  function nextUpCard() {
    return h('div', { class: 'card' },
      h('h2', null, 'Next up'),
      D.nextUp.length ? D.nextUp.map(function (e) {
        var bar = h('div', { class: 'nu-bar', 'aria-hidden': 'true' }); bar.style.background = color(e.color);
        return h('div', { class: 'nu' }, bar, h('div', null,
          h('div', { class: 'muted' }, e.person + (e.feed && e.feed !== e.person ? ' · ' + e.feed : '') + ' · ' + fmt(e.start, { weekday: 'short' }) + ' ' + time(e.start)),
          h('div', { class: 'nu-title' }, e.title),
          e.location ? h('div', { class: 'muted' }, e.location) : null,
          e.leave ? h('div', null, h('span', { class: 'nu-leave' }, 'Leave by ' + time(e.leave)), ' ', h('span', { class: 'muted' }, e.why))
            : e.arriveBy ? h('div', null, h('span', { class: 'nu-leave' }, 'Arrive by ' + time(e.arriveBy)),
                D.hasHome ? null : h('span', { class: 'muted' }, ' · add home_address in Settings for drive time'))
            : null));
      }) : h('div', { class: 'empty' }, D.lastSync ? 'Nothing coming up.' : 'Waiting for the first calendar sync. Run setup() in the script editor.'));
  }

  function weekCard() {
    var byDay = {};
    D.events.forEach(function (e) { var k = dayKey(e.start); (byDay[k] = byDay[k] || []).push(e); });
    var days = [];
    for (var i = 0; i < 7; i++) { var d = keyToDate(D.today); d.setDate(d.getDate() + i); days.push(d); }
    return h('div', { class: 'card grow' },
      h('div', { style: 'display:flex;justify-content:space-between;align-items:baseline' },
        h('h2', null, 'This week'),
        h('div', { class: 'legend' }, members().map(function (p) { return h('span', null, tag(p.name, p.color), p.name); }))),
      days.map(function (d, i) {
        var k = dayKey(d.getTime());
        var evs = byDay[k] || [];
        return h('div', { class: 'day' + (i === 0 ? ' today' : '') },
          h('div', { class: 'day-label' }, h('div', { class: 'eyebrow' }, fmt(d, { weekday: 'short' })), h('div', { class: 'day-num display' }, d.getDate())),
          h('div', { class: 'day-events' }, evs.length ? evs.map(function (e) {
            return h('span', { class: 'chip' }, dot(e.color), e.allDay ? null : h('b', null, time(e.start)), e.title, tag(e.person, e.personColor));
          }) : h('span', { class: 'empty' }, 'Free')));
      }));
  }

  function nextSchoolDay() {
    var d = keyToDate(D.today);
    do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6);
    return d;
  }
  function meal(dateKey, slot) { return D.meals[dateKey + '|' + slot]; }

  function mealsCard() {
    var tonight = meal(D.today, 'dinner');
    var sd = nextSchoolDay(); var sk = dayKey(sd.getTime());
    var later = [];
    for (var i = 1; i <= 3; i++) { var d = keyToDate(D.today); d.setDate(d.getDate() + i); later.push(d); }
    return h('div', { class: 'card' },
      h('h2', null, 'Meals'),
      h('div', { class: 'eyebrow' }, 'Tonight'),
      h('div', { class: 'nu-title' }, tonight ? tonight.recipe : 'Not planned yet'),
      tonight && tonight.cook ? h('div', { class: 'muted' }, tonight.cook + ' cooking') : null,
      h('div', { class: 'eyebrow', style: 'margin-top:.7em' }, 'Lunches ' + fmt(sd, { weekday: 'long' })),
      kids().map(function (k) {
        var m = meal(sk, 'lunch:' + k.name);
        var b = h('b', null, k.name); b.style.color = color(k.color);
        return h('div', null, b, ' · ', m ? m.recipe : h('span', { class: 'empty' }, 'needs a lunch'));
      }),
      h('div', { class: 'muted', style: 'margin-top:.7em' }, later.map(function (d) {
        var m = meal(dayKey(d.getTime()), 'dinner');
        return h('div', null, fmt(d, { weekday: 'short' }) + ' · ' + (m ? m.recipe : '—'));
      })));
  }

  function todoRow(t, interactive) {
    var c = color(colorOf(t.person));
    var who = h('b', null, t.person + ' '); who.style.color = c;
    if (!interactive) {
      var box = h('span', { class: 'box', 'aria-hidden': 'true' }); box.style.borderColor = c;
      return h('div', { class: 'row-line' }, box, h('span', null, who, t.text, t.due ? h('span', { class: 'muted' }, ' · due ' + fmt(keyToDate(t.due), { month: 'short', day: 'numeric' })) : null));
    }
    var id = 'td-' + t.id;
    return h('div', { class: 'item' + (t.done ? ' done' : '') },
      h('input', { type: 'checkbox', id: id, checked: t.done, onchange: function () { act('toggleTodo', t.id); } }),
      h('label', { for: id }, who, h('span', { class: 't' }, t.text), t.due ? h('span', { class: 'muted' }, ' · due ' + fmt(keyToDate(t.due), { month: 'short', day: 'numeric' })) : null));
  }

  function todosCard() {
    var open = D.todos.filter(function (t) { return !t.done; });
    return h('div', { class: 'card grow' }, h('h2', null, 'To-dos'),
      open.length ? open.slice(0, 8).map(function (t) { return todoRow(t, false); }) : h('div', { class: 'empty' }, 'All done!'));
  }

  function groceryCard() {
    var open = D.groceries.filter(function (g) { return !g.done; });
    return h('div', { class: 'card grow' },
      h('div', { style: 'display:flex;justify-content:space-between;align-items:baseline' }, h('h2', null, 'Groceries'), h('span', { class: 'muted' }, open.length + ' items')),
      open.length ? h('div', null, open.slice(0, 6).map(function (g) { return g.item; }).join(' · ') + (open.length > 6 ? ' · +' + (open.length - 6) + ' more' : ''))
        : h('div', { class: 'empty' }, 'List is empty'));
  }

  /* ---------- wall ---------- */
  function greeting() {
    var hr = +fmt(Date.now(), { hour: 'numeric', hour12: false });
    return hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
  }
  function renderWall() {
    var app = document.getElementById('app');
    app.replaceChildren(h('div', { class: 'wall' },
      errorMsg ? h('div', { class: 'error', role: 'alert' }, errorMsg) : null,
      h('header', { class: 'w-head' },
        h('div', null, h('div', { class: 'w-date display' }, fmt(Date.now(), { weekday: 'long', month: 'long', day: 'numeric' })),
          h('div', { class: 'w-sub', id: 'clock' }, time(Date.now()) + ' · ' + greeting())),
        weatherBlock()),
      wallColumns()));
  }

  /* Tiles the Layout tab can place. Add a new tile: write its function, then add it here and in TILES in Code.gs. */
  var TILE_FNS = {
    next_up: nextUpCard, week: weekCard, meals: mealsCard, todos: todosCard,
    groceries: groceryCard, joke: jokeCard, quote: quoteCard
  };
  function wallColumns() {
    var cols = {};
    (D.layout || []).forEach(function (t) { if (TILE_FNS[t.tile]) (cols[t.column] = cols[t.column] || []).push(t.tile); });
    var keys = Object.keys(cols).sort();
    var grid = h('div', { class: 'w-cols' });
    grid.style.gridTemplateColumns = keys.map(function (k) { return cols[k].indexOf('week') >= 0 ? '37fr' : '28fr'; }).join(' ');
    keys.forEach(function (k) {
      add(grid, h('section', { class: 'col' }, cols[k].map(function (name) { return TILE_FNS[name](); })));
    });
    return grid;
  }

  function jokeCard() {
    var d = D.daily;
    return h('div', { class: 'card compact' }, h('div', { class: 'eyebrow' }, 'Joke of the day'),
      h('div', { class: 'daily-text' }, d && d.joke ? d.joke : 'No joke today, sorry!'));
  }
  function quoteCard() {
    var d = D.daily;
    if (!d || !d.quote) return h('div', { class: 'card compact' }, h('div', { class: 'eyebrow' }, 'Quote of the day'), h('div', { class: 'empty' }, 'Unavailable'));
    return h('div', { class: 'card compact' }, h('div', { class: 'eyebrow' }, 'Quote of the day'),
      h('div', { class: 'daily-text' }, '“' + d.quote + '”'),
      d.author ? h('div', { class: 'muted' }, '— ' + d.author) : null,
      d.quoteCredit ? h('div', { class: 'credit' }, 'Inspirational quotes provided by ', h('a', { href: 'https://zenquotes.io/', target: '_blank', rel: 'noopener noreferrer' }, 'ZenQuotes API')) : null);
  }
  function minutes(hhmm) { var p = String(hhmm).split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
  function updateDim() {
    if (!D) return;
    var now = minutes(fmt(Date.now(), { hour: '2-digit', minute: '2-digit', hour12: false }));
    var a = minutes(D.dim.from), b = minutes(D.dim.to);
    var dim = a > b ? (now >= a || now < b) : (now >= a && now < b);
    document.body.classList.toggle('dimmed', dim);
  }

  /* ---------- remote ---------- */
  var TABS = [['today', 'Today'], ['meals', 'Meals'], ['recipes', 'Recipes'], ['groceries', 'Groceries'], ['todos', 'To-dos'], ['themes', 'Themes']];
  var setupData = null;

  function renderRemote() {
    var app = document.getElementById('app');
    var body;
    if (tab === 'meals') body = mealsTab();
    else if (tab === 'recipes') body = recipesTab();
    else if (tab === 'groceries') body = groceriesTab();
    else if (tab === 'todos') body = todosTab();
    else if (tab === 'themes') body = themesTab();
    else if (tab === 'setup') body = setupTab();
    else body = todayTab();
    app.replaceChildren(h('div', { class: 'remote' },
      h('div', { class: 'r-top' }, h('h1', null, 'Family Hub'), D.sheetUrl ? h('a', { href: D.sheetUrl, target: '_blank', rel: 'noopener' }, 'Open data sheet') : null),
      h('div', { class: 'tabs', role: 'tablist' }, TABS.concat(D.isOwner ? [['setup', 'Setup']] : []).map(function (t) {
        return h('button', { class: 'tab', role: 'tab', 'aria-selected': String(tab === t[0]), onclick: function () { tab = t[0]; toast = ''; render(); } }, t[1]);
      })),
      errorMsg ? h('div', { class: 'error', role: 'alert' }, errorMsg) : null,
      D.syncErrors ? h('div', { class: 'error' }, 'Some calendars didn’t sync: ' + D.syncErrors) : null,
      toast ? h('div', { class: 'toast', role: 'status' }, toast) : null,
      body));
  }

  function todayTab() {
    return [smartAddCard(), weatherBlock(), nextUpCard(), mealsCard(), jokeCard(), quoteCard()];
  }

  /* ---------- Say or type: "add milk and eggs", "to-do for Sam sharpen skates by Friday" ---------- */
  var DAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
  function cap(s) { s = String(s).trim(); return s.charAt(0).toUpperCase() + s.slice(1); }
  function splitItems(s) {
    return String(s).split(/,|\band\b|\bplus\b/).map(function (x) { return cap(x.replace(/^(some|a|an)\s+/i, '')); }).filter(Boolean);
  }
  function personFrom(word) {
    var w = String(word || '').toLowerCase();
    if (w === 'me' || w === 'myself') return D.me || 'Family';
    if (['family', 'everyone', 'us', 'all'].indexOf(w) >= 0) return 'Family';
    var p = (D.people || []).find(function (x) { return x.name.toLowerCase() === w; });
    return p ? p.name : null;
  }
  function dueFrom(word) {
    var d = keyToDate(D.today);
    if (word === 'tomorrow') d.setDate(d.getDate() + 1);
    else if (DAYS.indexOf(word) >= 0) d.setDate(d.getDate() + ((DAYS.indexOf(word) - d.getDay() + 7) % 7));
    return dayKey(d.getTime());
  }
  function parseCommand(raw) {
    var low = String(raw).trim().replace(/[.!?]+$/, '').toLowerCase().replace(/^(hey hub|ok hub|please)[,\s]*/, '');
    var due = '';
    var dm = low.match(/\s+(?:(?:by|on|due|for)\s+(today|tonight|tomorrow|sunday|monday|tuesday|wednesday|thursday|friday|saturday)|(today|tonight|tomorrow))$/);
    if (dm) { var w = dm[1] || dm[2]; due = dueFrom(w === 'tonight' ? 'today' : w); low = low.slice(0, dm.index); }
    var g = low.match(/^(?:add|put|get|buy|we need|need)?\s*(.+?)\s+(?:to|on|onto)\s+(?:the\s+)?(?:grocery|groceries|shopping)(?:\s+list)?$/);
    if (g) return { kind: 'grocery', items: splitItems(g[1]) };
    var r = low.match(/^remind\s+(\w+)\s+(?:to\s+)?(.+)$/);
    if (r && personFrom(r[1])) return { kind: 'todo', person: personFrom(r[1]), text: cap(r[2]), due: due };
    var t = low.match(/^(?:add\s+)?(?:a\s+)?(?:to-?do|todo|task)\s*(?:for\s+(\w+))?\s*[:,\-]?\s*(.+)$/);
    if (t) {
      var who = t[1] ? personFrom(t[1]) : 'Family';
      if (t[1] && !who) return { kind: 'todo', person: 'Family', text: cap(t[1] + ' ' + t[2]), due: due };
      return { kind: 'todo', person: who, text: cap(t[2]), due: due };
    }
    var a = low.match(/^(?:add|buy|get|we need|need)\s+(.+)$/);
    if (a) return { kind: 'grocery', items: splitItems(a[1]) };
    return { kind: 'unknown', text: cap(low) };
  }
  function describe(c) {
    if (c.kind === 'grocery') return 'Groceries: ' + c.items.join(', ');
    if (c.kind === 'todo') return 'To-do for ' + c.person + ': ' + c.text + (c.due ? ' (due ' + fmt(keyToDate(c.due), { weekday: 'short', month: 'short', day: 'numeric' }) + ')' : '');
    return 'Not sure where this goes. Pick one:';
  }
  function runCommand(c) {
    var done = function () { toast = 'Added: ' + describe(c).replace(/^\w[^:]*: /, ''); render(); };
    if (c.kind === 'grocery') return act('addGroceries', c.items).then(done);
    if (c.kind === 'todo') return act('addTodo', c.text, c.person, c.due).then(done);
  }

  function smartAddCard() {
    var input = h('input', { id: 'say', placeholder: 'Try “add milk and eggs” or “to-do for ' + ((kids()[0] || {}).name || 'Sam') + ' sharpen skates by Friday”', maxlength: '200', autocomplete: 'off' });
    var preview = h('div', { class: 'muted', style: 'min-height:22px;margin-top:8px', 'aria-live': 'polite' });
    var choices = h('div', { class: 'form', style: 'margin-top:6px' });
    function update() {
      choices.replaceChildren();
      var v = input.value.trim();
      if (!v) { preview.textContent = ''; return; }
      var c = parseCommand(v);
      preview.textContent = describe(c);
      if (c.kind === 'unknown') {
        add(choices, h('button', { type: 'button', class: 'btn ghost', onclick: function () { runCommand({ kind: 'grocery', items: [c.text] }); } }, 'Add to groceries'));
        add(choices, h('button', { type: 'button', class: 'btn ghost', onclick: function () { runCommand({ kind: 'todo', person: D.me || 'Family', text: c.text, due: '' }); } }, 'Add as a to-do'));
      }
    }
    input.addEventListener('input', update);
    var mic = h('button', { type: 'button', class: 'btn ghost mic', 'aria-label': 'Speak instead of typing', onclick: function () { listen(input, update, preview); } },
      micIcon(), h('span', null, 'Speak'));
    return h('div', { class: 'card' }, h('h2', null, 'Say or type'),
      h('form', { class: 'form', onsubmit: function (e) {
        e.preventDefault();
        var v = input.value.trim(); if (!v) return;
        var c = parseCommand(v);
        if (c.kind === 'unknown') { update(); return; }
        runCommand(c);
      } }, h('label', { for: 'say', style: 'flex:1 1 260px' }, 'What should I add?', input), mic, h('button', { class: 'btn', type: 'submit' }, 'Add')),
      preview, choices);
  }

  function micIcon() {
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('width', '20'); svg.setAttribute('height', '20'); svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none'); svg.setAttribute('stroke', 'currentColor'); svg.setAttribute('stroke-width', '2');
    svg.setAttribute('stroke-linecap', 'round'); svg.setAttribute('aria-hidden', 'true');
    ['M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z', 'M19 11a7 7 0 0 1-14 0', 'M12 18v3'].forEach(function (d) {
      var p = document.createElementNS(ns, 'path'); p.setAttribute('d', d); svg.appendChild(p);
    });
    return svg;
  }

  function listen(input, onDone, preview) {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var fallback = 'Voice isn’t available in this view. Tap the microphone on your phone’s keyboard and speak into the box instead.';
    if (!SR) { preview.textContent = fallback; input.focus(); return; }
    var rec;
    try { rec = new SR(); } catch (e) { preview.textContent = fallback; input.focus(); return; }
    rec.lang = 'en-CA'; rec.interimResults = false; rec.maxAlternatives = 1;
    preview.textContent = 'Listening…';
    rec.onresult = function (e) { input.value = e.results[0][0].transcript; onDone(); };
    rec.onerror = function (e) {
      preview.textContent = (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') ? fallback : 'Didn’t catch that. Try again.';
      input.focus();
    };
    rec.onend = function () { if (preview.textContent === 'Listening…') preview.textContent = ''; };
    try { rec.start(); } catch (e) { preview.textContent = fallback; input.focus(); }
  }

  function mealsTab() {
    var rows = [{ slot: 'dinner', label: 'Dinner', color: '#64748B', school: false }].concat(kids().map(function (k) {
      return { slot: 'lunch:' + k.name, label: k.name + ' lunch', color: k.color, school: true };
    }));
    var grid = h('div', { class: 'grid' }, h('span'), D.week.map(function (k) {
      return h('div', { class: 'eyebrow', style: 'text-align:center' }, fmt(keyToDate(k), { weekday: 'short', day: 'numeric' }));
    }));
    rows.forEach(function (r) {
      add(grid, h('div', { style: 'display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px' }, dot(r.color), r.label));
      D.week.forEach(function (k) {
        var dow = keyToDate(k).getDay();
        var off = r.school && (dow === 0 || dow === 6);
        var m = meal(k, r.slot);
        var isSel = sel && sel.date === k && sel.slot === r.slot;
        add(grid, h('button', {
          class: 'slot' + (!off && !m && r.school ? ' need' : '') + (isSel ? ' sel' : ''),
          disabled: off, 'aria-pressed': String(!!isSel),
          onclick: function () { sel = { date: k, slot: r.slot, lunch: r.school }; render(); }
        }, off ? 'No school' : m ? m.recipe : (r.school ? 'Needs lunch' : '+ Add')));
      });
    });
    var picker = null;
    if (sel) {
      var list = D.recipes.filter(function (x) { return x.type === 'both' || x.type === (sel.lunch ? 'lunch' : 'dinner'); });
      var cook = h('select', { id: 'cook' }, h('option', { value: '' }, 'Who’s cooking? (optional)'), members().map(function (p) { return h('option', { value: p.name }, p.name); }));
      picker = h('div', { class: 'card' },
        h('div', { style: 'display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap' },
          h('h2', null, 'Pick for ' + (sel.slot === 'dinner' ? 'dinner' : sel.slot.slice(6) + '’s lunch') + ', ' + fmt(keyToDate(sel.date), { weekday: 'long' })),
          h('div', { class: 'form' }, sel.lunch ? null : h('label', { for: 'cook' }, 'Cook', cook),
            h('button', { class: 'btn ghost', onclick: function () { act('setMeal', sel.date, sel.slot, '', ''); } }, 'Clear slot'))),
        list.length ? h('div', { class: 'recipes', style: 'margin-top:10px' }, list.map(function (x) {
          return h('button', { class: 'recipe', onclick: function () { act('setMeal', sel.date, sel.slot, x.name, sel.lunch ? '' : cook.value); } },
            h('div', { style: 'font-weight:700' }, x.name), h('div', { class: 'muted', style: 'font-size:13px' }, x.type));
        })) : h('p', { class: 'empty' }, 'No ' + (sel.lunch ? 'lunch' : 'dinner') + ' recipes yet. Add some in the Recipes tab.'));
    }
    return [
      h('div', { class: 'r-top' },
        h('div', { class: 'form' },
          h('button', { class: 'btn ghost', onclick: function () { weekOffset--; sel = null; refresh(); } }, '← Prev'),
          h('button', { class: 'btn ghost', onclick: function () { weekOffset = 0; sel = null; refresh(); } }, 'This week'),
          h('button', { class: 'btn ghost', onclick: function () { weekOffset++; sel = null; refresh(); } }, 'Next →')),
        h('button', { class: 'btn', onclick: function () {
          act('addWeekIngredients', D.week[0]).then(function (n) { toast = (n || 0) + ' ingredients added to Groceries'; render(); });
        } }, 'Add week’s ingredients to groceries')),
      h('div', { class: 'card planner' }, grid),
      picker];
  }

  function recipesTab() {
    var name = h('input', { id: 'rn', required: true, maxlength: '120' });
    var url = h('input', { id: 'ru', type: 'url', placeholder: 'https://…', maxlength: '500' });
    var type = h('select', { id: 'rt' }, h('option', { value: 'dinner' }, 'Dinner'), h('option', { value: 'lunch' }, 'Lunch'), h('option', { value: 'both' }, 'Both'));
    var ing = h('textarea', { id: 'ri', rows: '5', placeholder: 'One ingredient per line' });
    var notes = h('input', { id: 'rno', maxlength: '500' });
    return [
      h('div', { class: 'card' }, h('h2', null, 'Add a recipe'),
        h('form', { class: 'form', onsubmit: function (e) {
          e.preventDefault();
          act('addRecipe', { name: name.value, url: url.value, type: type.value, ingredients: ing.value, notes: notes.value })
            .then(function () { toast = 'Saved “' + name.value + '”'; render(); });
        } },
          h('label', { for: 'rn' }, 'Name', name), h('label', { for: 'ru' }, 'Link', url), h('label', { for: 'rt', style: 'flex:0 1 140px' }, 'Type', type),
          h('label', { for: 'ri', style: 'flex-basis:100%' }, 'Ingredients', ing), h('label', { for: 'rno', style: 'flex-basis:100%' }, 'Notes', notes),
          h('button', { class: 'btn', type: 'submit' }, 'Save recipe'))),
      h('div', { class: 'card' }, h('h2', null, 'Recipe library (' + D.recipes.length + ')'),
        D.recipes.length ? h('div', { class: 'list' }, D.recipes.map(function (x) {
          return h('div', { class: 'item' }, h('div', null,
            h('div', { style: 'font-weight:700' }, x.name),
            h('div', { class: 'muted', style: 'font-size:13px' }, x.type + (x.ingredients ? ' · ' + x.ingredients.split('\n').length + ' ingredients' : '')),
            /^https?:\/\//i.test(x.url) ? h('a', { href: x.url, target: '_blank', rel: 'noopener noreferrer' }, 'Open recipe') : null));
        })) : h('p', { class: 'empty' }, 'No recipes yet.'))];
  }

  function groceriesTab() {
    var input = h('input', { id: 'gi', placeholder: 'Add an item', maxlength: '80' });
    return h('div', { class: 'card' },
      h('div', { class: 'r-top' }, h('h2', null, 'Groceries'), h('button', { class: 'btn ghost', onclick: function () { act('clearDoneGroceries'); } }, 'Clear checked')),
      h('form', { class: 'form', onsubmit: function (e) { e.preventDefault(); var v = input.value.trim(); if (v) act('addGrocery', v); } },
        h('label', { for: 'gi' }, 'Item', input), h('button', { class: 'btn', type: 'submit' }, 'Add')),
      h('div', { class: 'list', style: 'margin-top:8px' }, D.groceries.map(function (g) {
        var id = 'g-' + g.id;
        return h('div', { class: 'item' + (g.done ? ' done' : '') },
          h('input', { type: 'checkbox', id: id, checked: g.done, onchange: function () { act('toggleGrocery', g.id); } }),
          h('label', { for: id }, h('span', { class: 't' }, g.item)));
      })));
  }

  function todosTab() {
    var text = h('input', { id: 'tt', placeholder: 'What needs doing?', maxlength: '160' });
    var who = h('select', { id: 'tw' }, D.people.map(function (p) { return h('option', { value: p.name }, p.name); }));
    who.value = 'Family';
    var due = h('input', { id: 'td', type: 'date' });
    var shown = D.todos.filter(function (t) { return todoFilter === 'All' || t.person === todoFilter; });
    return h('div', { class: 'card' },
      h('div', { class: 'r-top' }, h('h2', null, 'To-dos'), h('button', { class: 'btn ghost', onclick: function () { act('clearDoneTodos'); } }, 'Clear done')),
      h('div', { class: 'pills', role: 'group', 'aria-label': 'Show to-dos for' }, ['All'].concat(D.people.map(function (p) { return p.name; })).map(function (n) {
        return h('button', { class: 'pill', 'aria-pressed': String(todoFilter === n), onclick: function () { todoFilter = n; render(); } }, n === 'All' ? null : dot(colorOf(n)), n);
      })),
      h('form', { class: 'form', style: 'margin-top:10px', onsubmit: function (e) { e.preventDefault(); if (text.value.trim()) act('addTodo', text.value, who.value, due.value); } },
        h('label', { for: 'tt' }, 'To-do', text), h('label', { for: 'tw', style: 'flex:0 1 150px' }, 'For', who), h('label', { for: 'td', style: 'flex:0 1 170px' }, 'Due', due),
        h('button', { class: 'btn', type: 'submit' }, 'Add')),
      h('div', { class: 'list', style: 'margin-top:8px' }, shown.length ? shown.map(function (t) { return todoRow(t, true); }) : h('p', { class: 'empty' }, 'Nothing here.')));
  }

  var SWATCH = {
    Rink: ['#EEF3F9', '#FFFFFF', '#1D4ED8', '#0F172A'], Home: ['#F6F0E8', '#FFFDFA', '#A8480F', '#2A211B'],
    Night: ['#0B1220', '#131C2E', '#7FB4FF', '#E5E9F0'], Christmas: ['#EFE7DA', '#FFFCF6', '#B91C1C', '#1F4D2B']
  };
  function themesTab() {
    return h('div', { class: 'card' },
      h('h2', null, 'Themes'),
      h('p', { class: 'muted' }, 'Changes colours on the wall and here. The wall picks it up within 5 minutes.'),
      h('div', { class: 'themes' }, D.themes.map(function (name) {
        var s = SWATCH[name] || SWATCH.Rink;
        var sw = h('div', { class: 'swatch', 'aria-hidden': 'true' });
        sw.style.background = s[0];
        var bar = h('div', { style: 'height:12px;width:60%;border-radius:4px' }); bar.style.background = s[3];
        var cardBox = h('div', { style: 'flex:1;border-radius:6px;padding:6px' }); cardBox.style.background = s[1];
        var acc = h('div', { style: 'height:8px;width:50%;border-radius:3px' }); acc.style.background = s[2];
        cardBox.appendChild(acc); sw.appendChild(bar); sw.appendChild(cardBox);
        return h('button', { class: 'theme', 'aria-pressed': String(D.theme === name), onclick: function () {
          act('setTheme', name).then(function () { toast = 'Theme set to ' + name; render(); });
        } }, sw, h('div', { style: 'font-weight:700;margin-top:8px' }, name), D.theme === name ? h('div', { class: 'muted', style: 'font-size:13px' }, 'In use') : null);
      })));
  }

  /* ---------- setup (owner only) ---------- */
  function loadSetup() {
    return call('getSetup').then(function (d) { setupData = d; render(); }).catch(function (e) { errorMsg = e.message; render(); });
  }

  function setupTab() {
    if (!setupData) { loadSetup(); return h('div', { class: 'card' }, h('p', { class: 'loading' }, 'Loading your calendars…')); }
    var S = setupData;

    // Home
    var addr = h('input', { id: 'home', value: S.settings.home_address, placeholder: 'Street, city, postal code', maxlength: '200', autocomplete: 'street-address' });
    var df = h('input', { id: 'df', type: 'time', value: S.settings.dim_from });
    var dt = h('input', { id: 'dt', type: 'time', value: S.settings.dim_to });
    var home = h('div', { class: 'card' }, h('h2', null, 'Home'),
      h('p', { class: 'muted' }, 'Used for drive times and local weather. Stored only in your data sheet.'),
      h('form', { class: 'form', onsubmit: function (e) {
        e.preventDefault();
        call('saveHome', { home_address: addr.value, dim_from: df.value, dim_to: dt.value }).then(function (r) {
          toast = 'Home saved' + (r.location ? ' (' + r.location + ')' : ''); setupData = null; refresh();
        }).catch(function (e2) { errorMsg = e2.message; render(); });
      } }, h('label', { for: 'home', style: 'flex-basis:100%' }, 'Home address', addr),
        h('label', { for: 'df' }, 'Dim the wall from', df), h('label', { for: 'dt' }, 'until', dt),
        h('button', { class: 'btn', type: 'submit' }, 'Save home')));

    // People
    var rows = S.people.filter(function (p) { return p.name !== 'Family'; });
    var list = h('div', { class: 'list' });
    function personRow(p, i) {
      var name = h('input', { 'aria-label': 'Name', value: p.name, maxlength: '30', oninput: function () { p.name = name.value; } });
      var col = h('input', { type: 'color', 'aria-label': 'Colour', value: /^#[0-9a-f]{6}$/i.test(p.color) ? p.color : '#2563EB', oninput: function () { p.color = col.value; } });
      var em = h('input', { type: 'email', 'aria-label': 'Google account email', placeholder: 'Google email (to share access)', value: p.email, oninput: function () { p.email = em.value; } });
      var role = h('select', { 'aria-label': 'Role', onchange: function () { p.role = role.value; } },
        h('option', { value: 'parent' }, 'Parent'), h('option', { value: 'kid' }, 'Kid (gets lunches)'));
      role.value = p.role === 'parent' ? 'parent' : 'kid';
      return h('div', { class: 'form', style: 'padding:8px 0;border-top:1px solid var(--line)' },
        h('label', { style: 'flex:1 1 140px' }, 'Name', name), h('label', { style: 'flex:0 0 70px' }, 'Colour', col),
        h('label', { style: 'flex:2 1 220px' }, 'Email', em), h('label', { style: 'flex:1 1 150px' }, 'Role', role),
        h('button', { type: 'button', class: 'btn ghost', 'aria-label': 'Remove ' + p.name, onclick: function () { rows.splice(i, 1); drawPeople(); } }, 'Remove'));
    }
    function drawPeople() { list.replaceChildren(); rows.forEach(function (p, i) { add(list, personRow(p, i)); }); }
    drawPeople();
    var people = h('div', { class: 'card' }, h('h2', null, 'People'),
      h('p', { class: 'muted' }, 'To let someone use the app, add their Google email here, then share the Family Hub Data sheet with them as an Editor (Open data sheet → Share). The app can’t share it for you: it’s locked to this one sheet.'),
      list,
      h('div', { class: 'form', style: 'margin-top:10px' },
        h('button', { type: 'button', class: 'btn ghost', onclick: function () { rows.push({ name: '', color: '#7C3AED', email: '', role: 'kid' }); drawPeople(); } }, '+ Add person'),
        h('button', { type: 'button', class: 'btn', onclick: function () {
          call('savePeople', rows.concat([{ name: 'Family', color: '#475569', email: '', role: 'group' }])).then(function (r) {
            toast = 'People saved' + (r.shared.length ? '. Shared with ' + r.shared.join(', ') : ''); setupData = null; refresh();
          }).catch(function (e) { errorMsg = e.message; render(); });
        } }, 'Save people')));

    // Calendars
    var names = rows.map(function (p) { return p.name; }).concat(['Family']);
    var calList = h('div', { class: 'list' }, S.calendars.map(function (c) {
      var id = 'cal-' + c.id.replace(/[^a-z0-9]/gi, '');
      var box = h('input', { type: 'checkbox', id: id, checked: c.included, onchange: function () { c.included = box.checked; } });
      var who = h('select', { 'aria-label': 'Whose calendar is ' + c.name, onchange: function () { c.person = who.value; } },
        names.map(function (n) { return h('option', { value: n }, n); }));
      who.value = c.person && names.indexOf(c.person) >= 0 ? c.person : 'Family';
      c.person = who.value;
      return h('div', { class: 'item' }, box, dot(c.color), h('label', { for: id, style: 'flex:1' }, c.name), who);
    }));
    var cals = h('div', { class: 'card' }, h('h2', null, 'Calendars'),
      h('p', { class: 'muted' }, 'Tick the calendars to show, and pick whose each one is. Event colours come from Google Calendar.' +
        (S.lastSync ? ' Last sync: ' + new Date(S.lastSync).toLocaleString('en-CA') + '.' : '')),
      S.syncErrors ? h('div', { class: 'error' }, S.syncErrors) : null,
      calList,
      h('button', { type: 'button', class: 'btn', style: 'margin-top:10px', onclick: function () {
        var chosen = S.calendars.filter(function (c) { return c.included; }).map(function (c) { return { id: c.id, person: c.person }; });
        call('saveFeeds', chosen).then(function (r) {
          toast = 'Calendars saved: ' + r.events + ' events synced' + (r.errors.length ? ' (some problems: ' + r.errors.join('; ') + ')' : '');
          setupData = null; refresh();
        }).catch(function (e) { errorMsg = e.message; render(); });
      } }, 'Save calendars and sync'));

    return [home, people, cals,
      h('div', { class: 'card' }, h('h2', null, 'Wall link'),
        h('p', { class: 'muted' }, 'Open this on the wall screen and go full screen:'),
        h('code', { style: 'word-break:break-all' }, (D.appUrl || '') + '?view=wall'))];
  }

  /* ---------- boot ---------- */
  function firstRun() {
    var app = document.getElementById('app');
    if (/NO_ACCESS/.test(errorMsg)) {
      app.replaceChildren(h('div', { class: 'remote' }, h('div', { class: 'card' }, h('h1', null, 'Family Hub'),
        h('p', null, 'You don’t have access yet. Ask whoever set up Family Hub to share the Family Hub Data sheet with you, then reload this page.'))));
      return true;
    }
    if (!/NOT_SET_UP/.test(errorMsg)) return false;
    if (VIEW === 'wall') {
      app.replaceChildren(h('p', { class: 'loading' }, 'Family Hub isn’t set up yet. Open the app on your phone or computer to finish setup.'));
      return true;
    }
    var btn = h('button', { class: 'btn', onclick: function () {
      btn.disabled = true; btn.textContent = 'Setting up… (about 20 seconds)';
      call('bootstrap').then(function () { errorMsg = ''; tab = 'setup'; return refresh(); })
        .catch(function (e) { btn.disabled = false; btn.textContent = 'Set up Family Hub'; errorMsg = (e && e.message) || 'Setup failed.'; render(); });
    } }, 'Set up Family Hub');
    app.replaceChildren(h('div', { class: 'remote' }, h('div', { class: 'card' }, h('h1', null, 'Welcome to Family Hub'),
      h('p', null, 'This sets up the private “Family Hub Data” sheet in your Google Drive and makes you the owner. Next you’ll pick your calendars and add your family.'),
      btn)));
    return true;
  }

  function render() {
    if (!D && errorMsg && firstRun()) return;
    if (!D) {
      document.getElementById('app').replaceChildren(errorMsg ? h('p', { class: 'error', role: 'alert', style: 'margin:24px' }, errorMsg) : h('p', { class: 'loading' }, 'Loading Family Hub…'));
      return;
    }
    if (VIEW === 'wall') renderWall(); else renderRemote();
  }

  refresh();
  if (VIEW === 'wall') {
    setInterval(refresh, 5 * 60 * 1000);
    setInterval(function () {
      var c = document.getElementById('clock');
      if (c && D) c.textContent = time(Date.now()) + ' · ' + greeting();
      updateDim();
    }, 20 * 1000);
  } else {
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
  }
})();
</script>
