name: Deploy the background helper

# Every push to main that touches apps-script/ uploads the helper and updates its live address.
# The address never changes (the app's js/config.js points at it). Needs one repo secret: CLASPRC_JSON (see README),
# and .clasp.json pointing at the script inside the Family Hub Data sheet.
on:
  push:
    branches: [main]
    paths: ['apps-script/**', '.clasp.json', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Sign in to Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Add the CLASPRC_JSON repository secret first (see README, step 3)."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Check the project link
        run: |
          if [ ! -f .clasp.json ]; then
            echo "::error::Missing .clasp.json. Create the Family Hub Data sheet, open Extensions > Apps Script > Project Settings, and commit its Script ID (see README)."
            exit 1
          fi

      - name: Upload code
        run: clasp push --force

      - name: Update the live web app (same URL every time)
        run: |
          SHORT="${GITHUB_SHA::7}"
          ID=$(clasp deployments | grep -E '^- ' | grep -v '@HEAD' | head -n 1 | awk '{print $2}')
          if [ -z "$ID" ]; then
            clasp deploy --description "Family Hub helper $SHORT"
            ID=$(clasp deployments | grep -E '^- ' | grep -v '@HEAD' | head -n 1 | awk '{print $2}')
          else
            clasp deploy --deploymentId "$ID" --description "Family Hub helper $SHORT"
          fi
          URL="https://script.google.com/macros/s/$ID/exec"
          echo "Helper: $URL"
          {
            echo "### Family Hub helper deployed"
            echo ""
            echo "- Helper address: $URL"
            echo "- The app itself is on GitHub Pages: https://scalisec.github.io/family-hub/"
          } >> "$GITHUB_STEP_SUMMARY"
