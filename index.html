<!doctype html>
<html lang="en-CA" data-theme="Rink">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EEF3F9">
  <meta name="description" content="Family Hub: calendars, meals, groceries and to-dos for the family.">
  <title>Family Hub</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Paint the saved theme before anything loads, so there's no flash.
    try { var t = localStorage.getItem('fh.themeNow'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body class="app">
  <div id="app"><div class="boot">Family Hub</div></div>
  <noscript>Family Hub needs JavaScript turned on.</noscript>
</body>
</html>
